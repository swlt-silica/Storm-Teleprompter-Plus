name: Upload verified release packages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: upload-verified-release-packages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: swlt-silica/Storm-Teleprompter-Plus
    steps:
      - name: Download existing successful build artifacts
        run: |
          set -euo pipefail
          gh run download 43791631057 --name storm-floating-arm64-21fd25c5107cf912accaef1b6b2197d47d4299d5 --dir old-floating
          gh run download 43798795829 --name storm-floating-arm64-43b8593c6deb72077cc8d10bc8220c4e663aa790 --dir old-miui
          gh run download 43811699548 --name storm-floating-arm64-652057d2dbefbb506b9eab8fb7ba2757be8232e9 --dir cloud-android
          gh run download 43811699548 --name storm-cloud-windows-x64-652057d2dbefbb506b9eab8fb7ba2757be8232e9 --dir cloud-windows

      - name: Verify exact package bytes and stage original binaries
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          import shutil

          packages = [
              ('old-floating', '*.apk', 'v1.0.0-floating', 'storm-floating-1.0.0-android-universal.apk', '9509a9f2c06406d55f82385dc4fc1fd7aceb4893ca82bc14b6d2e42a974d72ca'),
              ('old-miui', '*.apk', 'v1.0.1-miui13', 'storm-redmi-note11t-pro-miui13.apk', '79b2ac66d883f6667d039f96d8051fba2fad92221e26c152041b48c93a45fcb4'),
              ('cloud-android', '*.apk', 'v1.1.0-cloud', 'storm-cloud-android-arm64.apk', '98265972c354096a43e1dc502f1297bd69fc0cbcedaa9e58ee482b396fad8bd9'),
              ('cloud-windows', '*.zip', 'v1.1.0-cloud', 'storm-cloud-windows-x64.zip', '5eb0ae25115c5d79c1653a2286e35338cc129d29ea941c77b9dbe630ebc1602a'),
          ]
          for directory, pattern, tag, name, expected in packages:
              matches = list(Path(directory).rglob(pattern))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one package in {directory}, got {len(matches)}')
              source = matches[0]
              actual = hashlib.sha256(source.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Hash mismatch for {name}: {actual}')
              destination = Path('release-packages') / tag / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              print(f'Verified {name}: {actual}')
          PYTHON

      - name: Upload verified binaries to prepared releases
        run: |
          set -euo pipefail
          gh release upload v1.0.0-floating release-packages/v1.0.0-floating/storm-floating-1.0.0-android-universal.apk --clobber
          gh release upload v1.0.1-miui13 release-packages/v1.0.1-miui13/storm-redmi-note11t-pro-miui13.apk --clobber
          gh release upload v1.1.0-cloud release-packages/v1.1.0-cloud/storm-cloud-android-arm64.apk release-packages/v1.1.0-cloud/storm-cloud-windows-x64.zip --clobber
